name: astrology
description: "Vedic astrology app: kundli, dasha, panchang and daily horoscope."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter:
    sdk: flutter
  google_sign_in: ^7.2.0
  path_provider: ^2.1.6
  pdf: ^3.13.1
  printing: ^5.15.1
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.18.3
  sweph: ^4.1.0+2.10.3
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/cities.tsv
